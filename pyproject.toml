[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage-services"
version = "0.1.0"
description = "Vantage API and fixture ingestion worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "psycopg[binary,pool]>=3.2,<4", "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/ingestion/tests", "tests"]
markers = ["database: requires TEST_DATABASE_URL pointing to an isolated database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = [".venv", "node_modules"]
